name: run-pytest

on: push

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install requirements
        run: pip install requirements.txt

      - name: Run pytest
        run: python3 -m pytest -v
